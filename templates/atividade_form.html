{% extends "base.html" %}
{% block title %}Registrar atividade | Ctrl Play{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">ACOMPANHAMENTO</p><h1>Registrar atividade</h1><p class="muted">Adicione um registro ao histórico do aluno.</p></div><a class="btn btn-outline" href="{{ url_for('atividades') }}">← Voltar</a></div>
<section class="panel form-panel"><form method="post" class="form-grid">
<input type="hidden" name="csrf_token" value="{{ session.get('csrf_token') }}">
<div class="field full-field"><label for="id_aluno">Aluno <span class="required">*</span></label><select id="id_aluno" name="id_aluno" required><option value="">Selecione um aluno</option>{% for aluno in alunos %}<option value="{{ aluno.id_aluno }}">{{ aluno.nome }}</option>{% endfor %}</select></div>
<div class="field full-field"><label for="titulo">Título da atividade <span class="required">*</span></label><input id="titulo" name="titulo" required maxlength="150" placeholder="Ex.: Primeiro jogo em Python"></div>
<div class="field"><label for="data_registro">Data <span class="required">*</span></label><input id="data_registro" name="data_registro" type="date" required value="{{ today }}"></div>
<div class="field"><label for="nota">Nota (0 a 10)</label><input id="nota" name="nota" type="number" min="0" max="10" step="0.1" placeholder="Ex.: 8,5"><small class="tiny muted">Deixe em branco se a atividade ainda não foi avaliada.</small></div>
<div class="field full-field"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" rows="3"></textarea></div>
<div class="field full-field"><label for="observacao">Observações</label><textarea id="observacao" name="observacao" rows="3"></textarea></div>
<div class="form-actions full-field"><a class="btn btn-outline" href="{{ url_for('atividades') }}">Cancelar</a><button class="btn btn-primary" type="submit">Salvar atividade</button></div>
</form></section>
{% endblock %}

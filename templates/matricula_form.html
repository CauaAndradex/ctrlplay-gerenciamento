{% extends "base.html" %}
{% block title %}Nova matrícula | Ctrl Play{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">VÍNCULOS</p><h1>Matricular aluno</h1><p class="muted">Associe um aluno ativo a uma turma ativa.</p></div><a class="btn btn-outline" href="{{ url_for('alunos') }}">← Voltar</a></div>
<section class="panel form-panel"><form method="post" class="form-stack">
<input type="hidden" name="csrf_token" value="{{ session.get('csrf_token') }}">
<label for="id_aluno">Aluno <span class="required">*</span></label><select id="id_aluno" name="id_aluno" required><option value="">Selecione um aluno</option>{% for aluno in alunos %}<option value="{{ aluno.id_aluno }}">{{ aluno.nome }}</option>{% endfor %}</select>
<label for="id_turma">Turma <span class="required">*</span></label><select id="id_turma" name="id_turma" required><option value="">Selecione uma turma</option>{% for turma in turmas %}<option value="{{ turma.id_turma }}">{{ turma.nome_turma }} — {{ turma.curso }}</option>{% endfor %}</select>
<div class="form-actions"><a class="btn btn-outline" href="{{ url_for('alunos') }}">Cancelar</a><button class="btn btn-primary" type="submit">Confirmar matrícula</button></div>
</form></section>
{% endblock %}
